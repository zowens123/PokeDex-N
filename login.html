<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in · PokeDex</title>
	<meta name="description" content="Sign in to the PokeDex.">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">

	<!-- Novus by Pendo -->
<script>
(function(apiKey){
    (function(p,e,n,d,o){var v,w,x,y,z;o=p[d]=p[d]||{};o._q=o._q||[];
    v=['initialize','identify','updateOptions','pageLoad','track', 'trackAgent'];for(w=0,x=v.length;w<x;++w)(function(m){
    o[m]=o[m]||function(){o._q[m===v[0]?'unshift':'push']([m].concat([].slice.call(arguments,0)));};})(v[w]);
    y=e.createElement(n);y.async=!0;y.src='https://cdn.pendo.io/agent/static/'+apiKey+'/pendo.js';

	<script src="js/auth.js"></script>
	<script src="js/analytics.js"></script>
	<script>
		// Bounce an already-signed-in visitor before the form paints.
		window.PokeDex.auth.redirectIfAuthenticated();
	</script>
</head>
<body>
	<header data-site-header></header>

	<main class="auth">
		<div class="auth__card">
			<div class="auth__header">
				<div class="auth__mark" aria-hidden="true"></div>
				<h1>Welcome back</h1>
				<p>Sign in to browse the Pokédex.</p>
			</div>

			<!-- Form-level errors (bad credentials, network) land here. -->
			<div id="formError" class="alert alert--error hidden" role="alert"></div>

			<form id="loginForm" novalidate>
				<div class="field">
					<label class="field__label" for="username">Username</label>
					<input
						class="input"
						id="username"
						name="username"
						type="text"
						autocomplete="username"
						autocapitalize="none"
						spellcheck="false"
						placeholder="ash.ketchum"
						aria-describedby="usernameError"
						required>
					<span class="field__error hidden" id="usernameError"></span>
				</div>

				<div class="field">
					<label class="field__label" for="password">Password</label>
					<div class="input-group">
						<input
							class="input"
							id="password"
							name="password"
							type="password"
							autocomplete="current-password"
							placeholder="••••••••"
							aria-describedby="passwordError"
							required>
						<button class="input-group__action" id="togglePassword" type="button" aria-pressed="false">
							Show
						</button>
					</div>
					<span class="field__error hidden" id="passwordError"></span>
				</div>

				<div class="field">
					<label class="checkbox">
						<input type="checkbox" id="remember" name="remember">
						<span>Keep me signed in on this device</span>
					</label>
				</div>

				<button class="btn btn--block" id="submitBtn" type="submit">
					<span id="submitLabel">Sign in</span>
				</button>
			</form>

			<p class="auth__footer">
				Demo sign-in — any username and password works. Nothing is verified, and nothing leaves this browser.
			</p>
		</div>
	</main>

	<script src="js/nav.js"></script>
	<script src="js/login.js"></script>
</body>
</html>
