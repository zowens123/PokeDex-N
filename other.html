	<header data-site-header></header>

	<main class="page page--narrow stack">
		<div class="page-heading">
			<h1>Other Page</h1>
			<p class="page-heading__sub">A scratch page for exercising analytics tagging.</p>
		</div>

		<section class="panel">
			<h2>Name fields</h2>
			<div class="form-row">
				<label class="field__label" for="fname">First name</label>
				<input class="input" type="text" id="fname" name="fname" placeholder="Your name…">
			</div>
			<div class="form-row">
				<label class="field__label" for="lname">Last name</label>
				<input class="input" type="text" id="lname" name="lname" placeholder="Your last name…">
			</div>
		</section>

		<section class="panel">
			<h2>Buttons</h2>
			<p>Targets for click tracking.</p>
			<div style="display:flex; gap:12px; flex-wrap:wrap;">
				<button class="btn" id="primaryTestBtn" type="button">Primary action</button>
				<button class="btn btn--secondary" id="secondaryTestBtn" type="button">Secondary action</button>
			</div>
			<p class="field__hint" id="clickResult" aria-live="polite"></p>
		</section>

		<section class="panel">
			<h2>Test Form</h2>
			<p>Resize the window — the label/field columns stack below 600px.</p>

			<form id="testForm">
				<div class="form-row">
					<label class="field__label" for="formFirstName">First Name</label>
					<input class="input" type="text" id="formFirstName" name="firstname" placeholder="Your name…">
				</div>
				<div class="form-row">
					<label class="field__label" for="formLastName">Last Name</label>
					<input class="input" type="text" id="formLastName" name="lastname" placeholder="Your last name…">
				</div>
				<div class="form-row">
					<label class="field__label" for="country">Country</label>
					<select class="select" id="country" name="country">
						<option value="australia">Australia</option>
						<option value="canada">Canada</option>
						<option value="usa">USA</option>
					</select>
				</div>
				<div class="form-row">
					<label class="field__label" for="subject">Subject</label>
					<textarea class="textarea" id="subject" name="subject" placeholder="Write something…"></textarea>
				</div>
				<button class="btn" type="submit" id="btn">Submit</button>
			</form>

			<p class="alert alert--success hidden" id="formSubmitted" role="status">
				Form submitted (no network request — this is a test page).
			</p>
		</section>
	</main>

	<script src="js/nav.js"></script>
	<script>
		(function () {
			"use strict";

			var result = document.getElementById("clickResult");

			// How many of the form's fields hold a value. The values themselves
			// are free text and stay out of analytics.
			function countCompletedFields(form) {
				var count = 0;
				new FormData(form).forEach(function (value) {
					if (String(value).trim()) count++;
				});
				return count;
			}

			document.getElementById("primaryTestBtn").addEventListener("click", function () {
				result.textContent = "Primary action clicked at " + new Date().toLocaleTimeString();
			});

			document.getElementById("secondaryTestBtn").addEventListener("click", function () {
				result.textContent = "Secondary action clicked at " + new Date().toLocaleTimeString();
			});

			document.getElementById("testForm").addEventListener("submit", function (event) {
				event.preventDefault();
				window.PokeDex.analytics.track("test_form_submitted", {
					country: document.getElementById("country").value,
					fieldsCompleted: countCompletedFields(event.currentTarget),
				});
				document.getElementById("formSubmitted").classList.remove("hidden");
			});
		})();
	</script>
